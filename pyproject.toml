[project]
name = "gtjob"
version = "0.1.0"
description = "Tailor a CV to a job description without inventing facts."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "jsonschema>=4.23",
    "pypdf>=6.0",
    "typst>=0.15",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.scripts]
gtjob = "gtjob.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gtjob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not live"]
markers = [
    "live: needs network or API key",
    "sample: needs the private sample CV",
]
